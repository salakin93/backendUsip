spring.application.name=Chat
server.port=8082
chatpdf.api.key=sec_kqB1cNpF6GtAFvILXl4brlCkZz90zLX3
chatpdf.api.url=https://api.chatpdf.com/v1/
storage.directory=src/main/resources/templates
spring.messages.encoding=UTF-8
spring.http.encoding.force=true

logging.level.org.springframework=INFO
logging.level.edu.usip.library=DEBUG
logging.file.name=logs/application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Configuración de la base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/library
spring.datasource.username=postgres
spring.datasource.password=salaco
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.display-request-duration=true
springdoc.api-docs.resolve-schema-properties=true

# Tamaño máximo para archivos subidos
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# Ruta de almacenamiento (opcional)
file.upload.directory=resources/templates


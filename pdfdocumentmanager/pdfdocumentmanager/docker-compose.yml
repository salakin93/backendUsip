services:
  db:
    image: postgres:16-alpine
    container_name: pdf_manager_db
    environment:
      POSTGRES_DB: pdf_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdf_manager"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf_manager_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Si quieres sobreescribir variables desde aquí:
      JWT_SECRET: "MiClaveSuperSecretaMuyLarga1234567890"
      JWT_EXPIRATION_MS: "86400000"
      CHATPDF_API_KEY: "${CHATPDF_API_KEY:-}"
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
